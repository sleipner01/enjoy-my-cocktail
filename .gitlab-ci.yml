image: oven/bun:1

stages:
  - setup
  - test
  - lint
  - lint-css
  - build

bun-setup:
  stage: setup
  script:
    - bun install --frozen-lockfile
  artifacts:
    paths:
      - node_modules

unit-test-job:
  stage: test
  script:
    - echo "Running unit tests..."
    - bun run coverage
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    when: always
    paths:
      - ./coverage/junit.xml
    reports:
      junit: ./coverage/junit.xml

lint-test-job 1/2:
  stage: lint
  script:
    - echo "Linting code..."
    - bun run lint
    - echo "No lint issues found."

lint-test-job 2/2:
  stage: lint-css
  script:
    - echo "Linting code..."
    - bun run lint:css
    - echo "No lint issues found."

build-job:
  stage: build
  script:
    - echo "Compiling the code..."
    - bun run build:ci
    - echo "Compile complete."
